{% extends "base.html" %}
{% block title %}フロア図{% endblock %}
{% block content %}
<h1>フロア図</h1>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post" action="/admin/floors" enctype="multipart/form-data">
  <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
  <label for="building">建物名</label>
  <input id="building" name="building" maxlength="50" required>
  <label for="floor_label">階（例：2F）</label>
  <input id="floor_label" name="floor_label" maxlength="20" required>
  <label for="sort_order">並び順（小さいほど先）</label>
  <input id="sort_order" name="sort_order" type="number" value="0">
  <label for="image">フロア図の画像（PNG／JPEG、10MBまで。北が上、建物が図の端いっぱいのもの）</label>
  <input id="image" name="image" type="file" accept="image/png,image/jpeg" required>
  <p><button type="submit">追加</button></p>
</form>
<table>
  <tr><th>建物</th><th>階</th><th>位置合わせ</th><th></th></tr>
  {% for f in floors %}
  <tr>
    <td>{{ f.building }}</td>
    <td>{{ f.floor_label }}</td>
    <td>{{ '登録済み' if f.is_aligned else '未登録' }}</td>
    <td><a href="/admin/floors/{{ f.id }}">編集</a></td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
