{% extends "base.html" %}
{% block title %}備品の種別{% endblock %}
{% block content %}
<h1>備品の種別</h1>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post" action="/admin/categories">
  <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
  <label for="name">種別を追加</label>
  <input id="name" name="name" maxlength="50" required>
  <p><button type="submit">追加</button></p>
</form>
<table>
  <tr><th>種別</th><th>状態</th><th></th></tr>
  {% for c in categories %}
  <tr>
    <td>{{ c.name }}</td>
    <td>{{ '使用中' if c.is_active else '停止中' }}</td>
    <td>
      <form class="inline" method="post" action="/admin/categories/{{ c.id }}/toggle">
        <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
        <button class="sub" type="submit">{{ '停止する' if c.is_active else '使用する' }}</button>
      </form>
    </td>
  </tr>
  {% endfor %}
</table>
<p class="note">停止した種別は、新しい備品の選択肢に出ません（登録済みの備品は、そのままです）。</p>
{% endblock %}
