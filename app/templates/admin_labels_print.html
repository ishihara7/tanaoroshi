<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QRラベル（{{ labels|length }}枚）</title>
  <style>
    /* 印刷では、A4・余白10mm・実寸（100%）で並べる。画面では、確認用に表示する */
    @page { size: A4; margin: 10mm; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 12px; background: #fff; color: #000; font-family: "Yu Gothic", "Hiragino Sans", Meiryo, sans-serif; }
    .toolbar { margin-bottom: 12px; font-size: 14px; }
    .toolbar button { font-size: 16px; padding: 8px 16px; }
    .label { text-align: center; padding: 1mm; break-inside: avoid; page-break-inside: avoid; overflow: hidden; }
    .label .qr { margin: 0 auto; }
    .label svg { display: block; width: 100%; height: 100%; }
    .no { font-family: Consolas, "Courier New", monospace; font-weight: bold; line-height: 1.15; word-break: break-all; margin-top: 0.5mm; }
    .nm { line-height: 1.2; margin-top: 0.3mm; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

    {% if cut == 'grid' %}
    /* 裁断用：ラベルを隙間なく並べ、行・列を貫く点線を引く（点線の上を、カッターで切る） */
    .sheet { display: grid; grid-template-columns: repeat({{ columns }}, {{ cell_w }}mm); grid-auto-rows: {{ cell_h }}mm;
             width: {{ (columns * cell_w)|round(2) }}mm; border-top: 0.2mm dashed #777; border-left: 0.2mm dashed #777; }
    .label { width: {{ cell_w }}mm; height: {{ cell_h }}mm; border-right: 0.2mm dashed #777; border-bottom: 0.2mm dashed #777; }
    {% elif cut == 'box' %}
    /* 1枚ずつ囲む点線（はさみで切る向き） */
    .sheet { display: flex; flex-wrap: wrap; gap: 3mm; }
    .label { width: {{ cell_w }}mm; border: 0.2mm dashed #888; }
    {% else %}
    .sheet { display: flex; flex-wrap: wrap; gap: 3mm; }
    .label { width: {{ cell_w }}mm; }
    {% endif %}

    @media print {
      body { padding: 0; }
      .toolbar { display: none; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button type="button" onclick="window.print()">印刷する</button>
    {{ labels|length }}枚 ／ QR本体 {{ size_mm }}mm ／ 印刷の倍率は「100%（実際のサイズ）」にしてください
    {% if cut == 'grid' %}／ 点線の上を裁断します（1行に{{ columns }}枚）{% endif %}
  </div>
  <div class="sheet">
    {% for l in labels %}
    <div class="label">
      <div class="qr" style="width: {{ l.qr.total_mm }}mm; height: {{ l.qr.total_mm }}mm;">
        {{ l.qr.svg|safe }}
      </div>
      <div class="no" style="font-size: {{ l.font_mm }}mm;">{{ l.asset.asset_no }}</div>
      {% if show_name %}<div class="nm" style="font-size: {{ (l.font_mm * 0.75)|round(2) }}mm;">{{ l.asset.name }}</div>{% endif %}
    </div>
    {% endfor %}
  </div>
</body>
</html>
