{% extends "base.html" %}
{% block title %}ログイン{% endblock %}
{% block content %}
<div class="auth">
  <div class="logo"><svg viewBox="0 0 24 24"><circle cx="12" cy="10" r="3"/><path d="M12 21s-7-5.2-7-11a7 7 0 0 1 14 0c0 5.8-7 11-7 11z"/></svg></div>
  <h1>備品所在管理</h1>
  <p class="note" style="text-align:center;margin-top:-6px">ログインしてください</p>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="login_id">ログインID</label>
    <input id="login_id" name="login_id" autocomplete="username" autocapitalize="none" autocorrect="off" required>
    <label for="password">パスワード</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <p style="margin-bottom:0"><button type="submit">ログイン</button></p>
  </form>
</div>
{% endblock %}
