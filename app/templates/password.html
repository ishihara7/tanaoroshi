{% extends "base.html" %}
{% block title %}パスワード変更{% endblock %}
{% block content %}
<h1>パスワード変更</h1>
{% if user.must_change_password %}
<p class="note">初期パスワードのままです。新しいパスワードを設定してください。</p>
{% endif %}
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post" action="/account/password">
  <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
  <label for="current_password">現在のパスワード</label>
  <input id="current_password" name="current_password" type="password" autocomplete="current-password" required>
  <label for="new_password">新しいパスワード（12文字以上）</label>
  <input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="12" required>
  <label for="confirm_password">新しいパスワード（確認）</label>
  <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="12" required>
  <p><button type="submit">変更する</button></p>
</form>
{% endblock %}
