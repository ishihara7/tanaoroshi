<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}備品所在管理{% endblock %}</title>
  <style>
    :root { --fg:#1f2937; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; --err:#b00020; --bg:#fff; --ok:#0f766e; }
    @media (prefers-color-scheme: dark) { :root { --fg:#e5e7eb; --muted:#9ca3af; --line:#374151; --accent:#60a5fa; --err:#f87171; --bg:#111827; --ok:#5eead4; } }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, "Hiragino Sans", "Yu Gothic UI", sans-serif; color:var(--fg); background:var(--bg); }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
    header a { color:var(--accent); text-decoration:none; margin-right:12px; }
    main { padding:16px; max-width:720px; margin:0 auto; }
    h1 { font-size:1.25rem; margin:8px 0 16px; }
    label { display:block; margin:12px 0 4px; font-size:.9rem; }
    input, select { width:100%; font-size:1rem; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); }
    button { font-size:1rem; padding:10px 16px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; }
    button.sub { background:transparent; color:var(--accent); }
    .err { color:var(--err); margin:12px 0; }
    .note { color:var(--muted); font-size:.85rem; }
    .issued { border:2px solid var(--ok); border-radius:8px; padding:12px; margin:12px 0; }
    .issued code { font-size:1.1rem; word-break:break-all; }
    table { border-collapse:collapse; width:100%; font-size:.9rem; }
    th, td { border-bottom:1px solid var(--line); padding:8px 6px; text-align:left; vertical-align:middle; }
    form.inline { display:inline; }
    form.inline button { padding:4px 10px; font-size:.85rem; }
  </style>
</head>
<body>
  {% if user %}
  <header>
    <nav>
      <a href="/">ホーム</a>
      {% if user.role == 'admin' %}<a href="/admin/users">ユーザー管理</a>{% endif %}
      <a href="/account/password">パスワード変更</a>
    </nav>
    <form method="post" action="/logout" class="inline">
      <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
      <span class="note">{{ user.display_name }}</span>
      <button class="sub" type="submit">ログアウト</button>
    </form>
  </header>
  {% endif %}
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
