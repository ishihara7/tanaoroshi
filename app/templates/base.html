<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <title>{% block title %}備品所在管理{% endblock %}</title>
  <style>
    :root {
      --bg: #f4f5f9; --card: #ffffff; --fg: #0f172a; --muted: #64748b; --line: #e5e7ef;
      --accent: #4f46e5; --accent-fg: #ffffff; --accent-soft: #eef0ff;
      --ok: #059669; --ok-soft: #e8f8f1; --err: #dc2626; --err-soft: #fdeceb;
      --shadow: 0 1px 2px rgba(15, 23, 42, .05), 0 6px 20px rgba(15, 23, 42, .06);
      --radius: 16px; --radius-sm: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1020; --card: #141b30; --fg: #e8ebf4; --muted: #96a0b8; --line: #263050;
        --accent: #8b93ff; --accent-fg: #0b1020; --accent-soft: #1d2550;
        --ok: #34d399; --ok-soft: #0f2b25; --err: #f87171; --err-soft: #321618;
        --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--fg); line-height: 1.65;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
      padding-bottom: env(safe-area-inset-bottom);
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ---- 上部のバー ---- */
    .topbar {
      position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--card) 88%, transparent);
      -webkit-backdrop-filter: saturate(180%) blur(14px); backdrop-filter: saturate(180%) blur(14px);
      border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top);
    }
    .topbar-inner { max-width: 760px; margin: 0 auto; padding: 10px 16px 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; letter-spacing: .01em; color: var(--fg); }
    .brand:hover { text-decoration: none; }
    .brand-mark { width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(135deg, #6366f1, #8b5cf6); display: grid; place-items: center; }
    .brand-mark svg { width: 15px; height: 15px; stroke: #fff; }
    .who { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--muted); }
    .nav { max-width: 760px; margin: 0 auto; padding: 8px 12px 10px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
    .nav::-webkit-scrollbar { display: none; }
    .nav a { flex: none; padding: 7px 14px; border-radius: 999px; color: var(--muted); font-weight: 600; font-size: .92rem; }
    .nav a:hover { text-decoration: none; background: var(--accent-soft); }
    .nav a.active { background: var(--accent-soft); color: var(--accent); }

    /* ---- 本文 ---- */
    main { max-width: 760px; margin: 0 auto; padding: 22px 16px 72px; }
    h1 { font-size: 1.55rem; font-weight: 800; letter-spacing: -.01em; line-height: 1.3; margin: 4px 0 14px; }
    h2 { font-size: 1.05rem; font-weight: 700; margin: 30px 0 10px; }
    p { margin: 10px 0; }
    .note { color: var(--muted); font-size: .86rem; }
    .err { color: var(--err); background: var(--err-soft); border-radius: var(--radius-sm); padding: 10px 14px; margin: 12px 0; font-weight: 600; font-size: .92rem; }

    /* ---- カード・フォーム ---- */
    main > form, .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin: 14px 0; box-shadow: var(--shadow); }
    label { display: block; margin: 14px 0 6px; font-size: .86rem; font-weight: 700; color: var(--muted); }
    label:first-child { margin-top: 0; }
    input, select, textarea {
      width: 100%; min-height: 48px; padding: 11px 14px; font: inherit; font-size: 16px; /* 16px未満だと、iPhoneで入力時に拡大される */
      color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-sm); outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
    input[type="checkbox"], input[type="radio"] { width: 20px; min-height: 20px; height: 20px; accent-color: var(--accent); }
    input[type="file"] { padding: 10px; }

    /* ---- ボタン ---- */
    button, .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 20px;
      font: inherit; font-size: 1rem; font-weight: 700; color: var(--accent-fg); background: var(--accent);
      border: 1px solid var(--accent); border-radius: var(--radius-sm); cursor: pointer; text-decoration: none;
      transition: transform .05s, filter .15s, background .15s;
    }
    button:hover, .btn:hover { filter: brightness(1.06); text-decoration: none; }
    button:active, .btn:active { transform: scale(.98); }
    button:disabled { opacity: .55; cursor: default; }
    button.sub, .btn.sub { color: var(--accent); background: transparent; border-color: var(--line); }
    button.sub:hover, .btn.sub:hover { background: var(--accent-soft); filter: none; }
    button.danger { color: var(--err); background: transparent; border-color: var(--line); }
    form.inline { display: inline; margin: 0; padding: 0; background: none; border: 0; box-shadow: none; }
    form.inline button { min-height: 34px; padding: 4px 12px; font-size: .85rem; }
    a > button { pointer-events: none; }  /* リンクの中のボタンは、リンクとして動く */

    /* ---- 表 ---- */
    table { width: 100%; border-collapse: collapse; font-size: .92rem; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
    th { text-align: left; font-size: .76rem; font-weight: 700; color: var(--muted); letter-spacing: .04em; padding: 10px 14px; background: color-mix(in srgb, var(--bg) 60%, var(--card)); border-bottom: 1px solid var(--line); }
    td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    tr:last-child td { border-bottom: 0; }

    /* ---- 状態の表示（タグ画面・初期パスワードなど） ---- */
    .issued { border: 1px solid var(--line); background: var(--card); border-radius: var(--radius); padding: 16px 18px; margin: 14px 0; box-shadow: var(--shadow); }
    .issued code { font-size: 1.1rem; word-break: break-all; }
    .status { display: flex; align-items: center; gap: 14px; border-radius: var(--radius); padding: 18px; margin: 14px 0; font-weight: 700; font-size: 1.05rem; background: var(--accent-soft); color: var(--accent); }
    .status .icon { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); }
    .status .icon svg { width: 20px; height: 20px; stroke: var(--accent-fg); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .status .spin { width: 20px; height: 20px; border-radius: 50%; border: 3px solid color-mix(in srgb, var(--accent-fg) 35%, transparent); border-top-color: var(--accent-fg); animation: spin .8s linear infinite; }
    .status.is-ok { background: var(--ok-soft); color: var(--ok); }
    .status.is-ok .icon { background: var(--ok); }
    .status.is-wait .icon { background: var(--accent); }
    .status.is-wait .icon .i-wait { display: block; }
    .status.is-error { background: var(--err-soft); color: var(--err); }
    .status.is-error .icon { background: var(--err); }
    .status .icon > * { display: none; }
    .status.is-busy .icon .spin, .status.is-ok .icon .i-ok, .status.is-error .icon .i-err { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .status .spin { animation-duration: 3s; } button, .btn { transition: none; } }

    /* ---- 一覧・操作カード ---- */
    .list { display: grid; gap: 10px; margin: 14px 0; }
    .item { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); color: var(--fg); }
    .item:hover { text-decoration: none; border-color: var(--accent); }
    .item .main { min-width: 0; }
    .item .title { font-weight: 700; overflow-wrap: anywhere; }
    .sub-text { color: var(--muted); font-size: .84rem; }
    .item .chev { flex: none; color: var(--muted); font-size: 1.3rem; }
    .actions { display: grid; gap: 12px; margin: 16px 0; }
    .action { display: flex; align-items: center; gap: 16px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); color: var(--fg); }
    .action:hover { text-decoration: none; border-color: var(--accent); }
    .action .ico { flex: none; width: 48px; height: 48px; border-radius: 14px; background: var(--accent-soft); display: grid; place-items: center; }
    .action .ico svg { width: 24px; height: 24px; stroke: var(--accent); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .action strong { display: block; font-size: 1.05rem; }
    .action span { color: var(--muted); font-size: .86rem; }
    .auth { max-width: 420px; margin: 8vh auto 0; }
    .auth .logo { width: 54px; height: 54px; border-radius: 16px; background: linear-gradient(135deg, #6366f1, #8b5cf6); display: grid; place-items: center; margin: 0 auto 14px; }
    .auth .logo svg { width: 28px; height: 28px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .auth h1 { text-align: center; }
    .auth form { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
    .auth button[type="submit"] { width: 100%; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 4px; }
    .chips a { padding: 7px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); font-weight: 600; font-size: .88rem; }
    .chips a:hover { text-decoration: none; border-color: var(--accent); background: var(--accent-soft); }
    .hint { color: var(--muted); font-size: .8rem; margin: 6px 0 0; }
    .user { margin: 0; }
    .user-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
    .user-name strong { display: block; }
    .badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .badge { font-size: .74rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
    .badge.admin { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
    .badge.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
    .badge.off { background: var(--err-soft); color: var(--err); border-color: transparent; }
    .badge.warn { background: #fff4db; color: #a15c00; border-color: transparent; }
    .user-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    details > summary { cursor: pointer; padding: 6px 0; }
    pre { margin: 0; }
    @media (min-width: 640px) { .actions { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  {% if user %}
  {% set p = request.url.path %}
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="10" r="3"/><path d="M12 21s-7-5.2-7-11a7 7 0 0 1 14 0c0 5.8-7 11-7 11z"/></svg></span>
        備品所在管理
      </a>
      <form method="post" action="/logout" class="inline who">
        <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
        <span>{{ user.display_name }}</span>
        <button class="sub" type="submit">ログアウト</button>
      </form>
    </div>
    <nav class="nav">
      <a href="/" class="{{ 'active' if p == '/' }}">ホーム</a>
      <a href="/assets" class="{{ 'active' if p.startswith('/assets') }}">検索</a>
      <a href="/attention" class="{{ 'active' if p.startswith('/attention') }}">要確認</a>
      {% if user.role == 'admin' %}
      <a href="/admin/assets" class="{{ 'active' if p.startswith('/admin/assets') or p.startswith('/admin/labels') or p.startswith('/admin/export') }}">備品の管理</a>
      <a href="/admin/users" class="{{ 'active' if p.startswith('/admin/users') }}">ユーザー</a>
      {% endif %}
      <a href="/account/password" class="{{ 'active' if p.startswith('/account') }}">パスワード</a>
    </nav>
  </header>
  {% endif %}
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
